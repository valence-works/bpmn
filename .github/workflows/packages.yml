name: Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink wants full history.

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show dotnet version
        run: dotnet --version

      - name: Compute package version
        id: version
        run: |
          set -euo pipefail

          if [ ! -f Directory.Build.props ]; then
            echo "Directory.Build.props not found"
            exit 1
          fi

          BASE_VERSION=$(grep -m 1 '<Version>' Directory.Build.props | sed -E 's/.*<Version>([^<]+)<.*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to read base Version from Directory.Build.props"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"

            if [ -z "$VERSION" ]; then
              echo "Release tag name is empty; cannot determine version."
              exit 1
            fi

            if [ "$VERSION" != "$BASE_VERSION" ]; then
              echo "Warning: tag version ($VERSION) does not match Directory.Build.props ($BASE_VERSION). Using the tag."
            fi

            PACKAGE_VERSION="$VERSION"
            echo "Release package version: $PACKAGE_VERSION"
          else
            PACKAGE_VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}"
            echo "Preview package version: $PACKAGE_VERSION"
          fi

          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Bpmn.slnx

      - name: Build
        run: dotnet build Bpmn.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Bpmn.slnx --configuration Release --no-build --verbosity normal

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p ./artifacts

          projects=(
            "src/Bpmn.Model/Bpmn.Model.csproj"
            "src/Bpmn.Interchange/Bpmn.Interchange.csproj"
            "src/Bpmn.Semantics/Bpmn.Semantics.csproj"
            "src/Bpmn.Runtime.InMemory/Bpmn.Runtime.InMemory.csproj"
          )

          for proj in "${projects[@]}"; do
            echo "Packing $proj..."
            dotnet pack "$proj" \
              --configuration Release \
              --no-build \
              -o ./artifacts \
              /p:Version=${{ env.PACKAGE_VERSION }}
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 7

  deploy-feedz:
    name: Deploy to Feedz.io
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      contents: read
    env:
      FEEDZ_SOURCE: "https://f.feedz.io/valence-works/bpmn/nuget/index.json"
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push packages to Feedz.io
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FEEDZ_API_KEY:-}" ]; then
            echo "::notice::FEEDZ_API_KEY is not set; skipping the preview publish."
            echo "Add the secret to publish previews to $FEEDZ_SOURCE."
            exit 0
          fi

          dotnet nuget add source "$FEEDZ_SOURCE" \
            --name Feedz \
            --username "token" \
            --password "$FEEDZ_API_KEY" \
            --store-password-in-clear-text

          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts/"
            exit 1
          fi

          for nupkg in "${nupkgs[@]}"; do
            echo "Pushing $nupkg to Feedz..."
            dotnet nuget push "$nupkg" \
              --source Feedz \
              --api-key "$FEEDZ_API_KEY" \
              --skip-duplicate
          done

  deploy-nuget:
    name: Deploy to NuGet.org
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published' && needs.build.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # A release publish is deliberate, so a missing key here IS a failure: the tag was cut with
          # the intent to ship, and silently not shipping would be the worse outcome.
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY is not set, so this release cannot be published."
            exit 1
          fi

          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts/"
            exit 1
          fi

          for nupkg in "${nupkgs[@]}"; do
            echo "Pushing $nupkg to NuGet.org..."
            dotnet nuget push "$nupkg" \
              --source "$NUGET_SOURCE" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
