name: Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink wants full history.

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show dotnet version
        run: dotnet --version

      - name: Compute package version
        id: version
        run: |
          set -euo pipefail

          if [ ! -f Directory.Build.props ]; then
            echo "Directory.Build.props not found"
            exit 1
          fi

          BASE_VERSION=$(grep -m 1 '<Version>' Directory.Build.props | sed -E 's/.*<Version>([^<]+)<.*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            echo "Failed to read base Version from Directory.Build.props"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"

            if [ -z "$VERSION" ]; then
              echo "Release tag name is empty; cannot determine version."
              exit 1
            fi

            if [ "$VERSION" != "$BASE_VERSION" ]; then
              echo "Warning: tag version ($VERSION) does not match Directory.Build.props ($BASE_VERSION). Using the tag."
            fi

            PACKAGE_VERSION="$VERSION"
            echo "Release package version: $PACKAGE_VERSION"
          else
            PACKAGE_VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}"
            echo "Preview package version: $PACKAGE_VERSION"
          fi

          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Bpmn.slnx

      - name: Build
        run: dotnet build Bpmn.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Bpmn.slnx --configuration Release --no-build --verbosity normal

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p ./artifacts

          # Preview builds publish everything; a tagged release publishes only what is ready to be
          # stable. Bpmn.Semantics and Bpmn.Runtime.InMemory ship at 0.2.0, once a second host has
          # validated the interpreter's port - see docs/adr/0002. Publishing them to nuget.org now
          # would turn every fix to that port into a breaking change against a public surface.
          if [ "${{ github.event_name }}" = "release" ]; then
            projects=(
              "src/Bpmn.Model/Bpmn.Model.csproj"
              "src/Bpmn.Interchange/Bpmn.Interchange.csproj"
            )
            echo "Release: packing the interchange half only."
          else
            projects=(
              "src/Bpmn.Model/Bpmn.Model.csproj"
              "src/Bpmn.Interchange/Bpmn.Interchange.csproj"
              "src/Bpmn.Semantics/Bpmn.Semantics.csproj"
              "src/Bpmn.Runtime.InMemory/Bpmn.Runtime.InMemory.csproj"
            )
            echo "Preview: packing all four."
          fi

          for proj in "${projects[@]}"; do
            echo "Packing $proj..."
            dotnet pack "$proj" \
              --configuration Release \
              --no-build \
              -o ./artifacts \
              /p:Version=${{ env.PACKAGE_VERSION }}
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 7

  deploy-feedz:
    name: Deploy to Feedz.io
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      contents: read
    env:
      FEEDZ_SOURCE: "https://f.feedz.io/valence-works/bpmn/nuget/index.json"
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push packages to Feedz.io
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FEEDZ_API_KEY:-}" ]; then
            echo "::notice::FEEDZ_API_KEY is not set; skipping the preview publish."
            echo "Add the secret to publish previews to $FEEDZ_SOURCE."
            exit 0
          fi

          dotnet nuget add source "$FEEDZ_SOURCE" \
            --name Feedz \
            --username "token" \
            --password "$FEEDZ_API_KEY" \
            --store-password-in-clear-text

          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts/"
            exit 1
          fi

          for nupkg in "${nupkgs[@]}"; do
            echo "Pushing $nupkg to Feedz..."

            # A 404 here means the key authenticated but the feed does not exist, which is a different
            # problem from a rejected package and has a different fix. Say which one it is.
            if ! output=$(dotnet nuget push "$nupkg" --source Feedz --api-key "$FEEDZ_API_KEY" --skip-duplicate 2>&1); then
              echo "$output"
              if echo "$output" | grep -q "404"; then
                echo "::error::The feed at $FEEDZ_SOURCE does not exist. Create it in feedz.io, or point FEEDZ_SOURCE at an existing one."
              fi
              exit 1
            fi

            echo "$output"
          done

  deploy-nuget:
    name: Deploy to NuGet.org
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published' && needs.build.result == 'success'
    permissions:
      contents: read
      # Lets the job request an OIDC token from GitHub, which nuget.org exchanges for a short-lived
      # API key. Without this the login step fails with no token available.
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Trusted publishing: no long-lived key is stored anywhere. The workflow proves its identity to
      # nuget.org with a signed OIDC token, and gets back a key valid for one hour.
      #
      # The matching policy on nuget.org is bound to the repository owner, the repository, and THIS
      # WORKFLOW'S FILE NAME - packages.yml. Renaming this file silently breaks publishing, so if that
      # ever happens the policy has to be updated to match.
      #
      # Requested immediately before the push, deliberately: the key expires in an hour.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_ORG_USERNAME }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # A release publish is deliberate, so failing to obtain a key IS a failure: the tag was cut
          # with the intent to ship, and silently not shipping would be the worse outcome.
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::No short-lived key was issued. Check that a trusted publishing policy on nuget.org names this repository and the workflow file packages.yml, and that NUGET_ORG_USERNAME holds the nuget.org profile name (not an email address)."
            exit 1
          fi

          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          shopt -s nullglob
          nupkgs=(./artifacts/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts/"
            exit 1
          fi

          for nupkg in "${nupkgs[@]}"; do
            echo "Pushing $nupkg to NuGet.org..."

            # A 403 on a package ID that does not exist yet almost always means the API key's glob
            # pattern does not cover it, not that the key is wrong. Those have different fixes, so
            # say which one this is rather than leaving a bare status code.
            if ! output=$(dotnet nuget push "$nupkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate 2>&1); then
              echo "$output"
              if echo "$output" | grep -q "403"; then
                echo "::error::NuGet rejected the key for $(basename "$nupkg"). For a package ID that has never been published, the key needs the 'Push new packages and package versions' scope AND a glob pattern matching Bpmn.* . Check the key at https://www.nuget.org/account/apikeys ."
              fi
              exit 1
            fi

            echo "$output"
          done
